name: multitask
channels:
  - conda-forge
  - pytorch
dependencies:
  - python =3.12
  - black >=24.4  # Latest available
  - matplotlib >=3.9
  - numpy >=2.0
  - pandas >=2.2
  - pyyaml >=6.0
  - scipy >=1.14
  - seaborn >=0.13
  - pytorch  # Latest stable
  - pytorch-cpu  # Or remove for CUDA auto-detect
  - tqdm >=4.66
  - pip
  - pip:
      - datasets>=1.6  # Fixed 'dataset'
      - ruff>=0.6
      - torchtyping
